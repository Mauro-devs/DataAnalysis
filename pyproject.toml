[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DataAnalysis"
version = "1.0.0"
description = "Analise de dados encima da base de dados"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  {name = "Mauro de Barros da Silva"},
  {name = "Davi de Souza"},
  {name = "Pedro Augusto"},
  {name = "Arthur Pomarolli"}
]

dependencies = [
    "matplotlib>=3.7.5",
    "mlxtend>=0.23.4",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "scikit-learn>=1.3.2",
    "scipy>=1.10.1",
    "seaborn>=0.13.2",
]
